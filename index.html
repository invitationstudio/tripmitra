<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripMitra</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="logo.png">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="logo.png" alt="Logo" style="width: 35px; height: 35px; border-radius: 8px; object-fit: cover; background: white;" />
      <div>
        <h1 style="font-size: 20px; margin: 0;">TripMitra</h1>
        <p style="font-size: 12px; margin: 0; opacity: 0.8;">Smart Trip Settlement</p>
      </div>
    </div>
    <button onclick="openSettingsModal()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px;">
      ⚙️ Settings
    </button>
  </header>

  <!-- TABS -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="expense">Add Expense</button>
    <button class="tab-btn" data-tab="ledger">Ledger</button>
    <button class="tab-btn" data-tab="settlement">Settlement</button>
  </nav>

  <main>
    <!-- DASHBOARD -->
    <section id="dashboard" class="tab-content active">
      <div class="card summary-card" id="summaryCard"></div>
      <h3>Expenses</h3>
      <div id="expenseList"></div>
    </section>

    <!-- ADD EXPENSE -->
    <section id="expense" class="tab-content">
      <div class="card">
        <h3>Add Expense</h3>
        <label>Description
          <input type="text" id="desc" placeholder="e.g. Petrol, Dinner" />
        </label>
        <label>Amount (₹)
          <input type="number" id="amount" placeholder="0" min="1" />
        </label>
        <label>Category
          <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Stay</option>
            <option>Fuel</option>
            <option>Shopping</option>
            <option>Tickets</option>
            <option>Misc</option>
          </select>
        </label>
        <label>Paid By
          <select id="paidBy"></select>
        </label>
        <div class="split-box">
          <p><strong>Split Among:</strong></p>
          <div id="splitMembers"></div>
        </div>
        <button class="btn-primary" id="saveExpense">Save Expense</button>
      </div>
    </section>

    <!-- LEDGER -->
    <section id="ledger" class="tab-content">
      <div class="ledger-switch">
        <button class="ledger-btn active" data-ledger="person">Per Person</button>
        <button class="ledger-btn" data-ledger="category">Per Category</button>
        <button class="ledger-btn" data-ledger="cash">Main Cashier Ledger</button>
      </div>
      <div id="ledgerContent"></div>
    </section>

    <!-- SETTLEMENT -->
    <section id="settlement" class="tab-content">
      <div id="settlementContent"></div>
    </section>

    <!-- PERSON DETAIL PAGE -->
    <section id="personDetailPage" class="tab-content" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f6fb; z-index: 100; overflow-y: auto; padding: 16px; display: none;">
      <button class="back-btn" onclick="closePersonDetail()">← Back to Ledger</button>
      <div id="personDetailContent"></div>
    </section>
  </main>

  <!-- CREATE NEW TRIP MODAL -->
  <div id="createTripModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Create New Trip</h3>
      <label>Trip Name <input type="text" id="newTripName" placeholder="e.g. Goa Trip 2025" /></label>
      <div style="margin-top: 10px; margin-bottom: 10px;">
        <label>Add Members:</label>
        <div id="newTripMembersList" style="display:flex; flex-direction:column; gap:5px; margin-bottom:5px;"></div>
        <div style="display:flex; gap:5px;">
          <input type="text" id="newMemberName" placeholder="Member Name" style="flex:1;" />
          <button class="btn-sm" onclick="addMemberToNewTrip()">Add</button>
        </div>
      </div>
      <button class="btn-primary" style="margin-top: 15px;" onclick="createNewTrip()">Create Trip</button>
      <button class="btn-sm outline" style="width: 100%; margin-top: 5px;" onclick="document.getElementById('createTripModal').classList.remove('active')">Cancel</button>
    </div>
  </div>

    <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-box">
      <h3>⚙️ Settings</h3>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
        <!-- NAVIN INSTALL BUTTON ITHE TAKA -->
        <button id="installAppBtn" class="btn-primary" style="background: #4f46e5; display: none;" onclick="installApp()">
          📲 Install App
        </button>
        
        <button class="btn-primary" style="background: #16a34a;" onclick="backupData()">
          📥 Backup Data (Download JSON)
        </button>
        <div style="border: 1px solid #ccc; padding: 10px; border-radius: 8px; background: #f9f9f9;">
          <p style="margin: 0 0 8px 0; font-size: 14px; font-weight: bold;">📤 Restore Data</p>
          <input type="file" id="restoreFile" accept=".json" style="font-size: 12px; width: 100%; margin-bottom: 8px;" />
          <button class="btn-sm" style="width: 100%;" onclick="restoreData()">Upload & Restore</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;" />
        <button class="btn-primary" style="background: #dc2626;" onclick="clearAllData()">
          🗑️ Clear All Data
        </button>
      </div>
      <button class="btn-sm outline" style="width: 100%; margin-top: 15px;" onclick="closeSettingsModal()">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
  
  <!-- Service Worker Register -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('SW Registered')).catch(err => console.log('SW Error', err));
      });
    }
  </script>
</body>
</html>
